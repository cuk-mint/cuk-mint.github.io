# ============================================================
#  아래는 Jekyll 엔진 설정 — 건드릴 일이 거의 없습니다
# ============================================================
markdown: kramdown
permalink: pretty
sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor

# 기본 언어는 영어(en), /ko/ 아래 페이지는 한국어(ko)
defaults:
  - scope: { path: "" }
    values: { layout: "page", lang: "en" }
  - scope: { path: "ko" }
    values: { layout: "page", lang: "ko" }
