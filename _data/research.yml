# ============================================================
#  연구 주제 — 홈 화면 카드와 Research 페이지에서 함께 씁니다.
#
#  title      : 주제 이름 (양쪽 공통, 영어)
#  summary    : 홈 카드용 짧은 소개 (영어)
#  summary_ko : 홈 카드용 짧은 소개 (한국어, /ko/)
#  detail     : Research 페이지용 긴 설명 (영어)
#  detail_ko  : Research 페이지용 긴 설명 (한국어, /ko/)
# ============================================================

- title: "Large Language Models"
  summary: >
    We study the pre-training and post-training of frontier-scale Korean
    large language models, with a focus on making long-context processing reliable.
  summary_ko: >
    프론티어급 한국어 대규모 언어모델의 사전학습과 사후학습을 연구합니다.
    특히 긴 문맥(long-context)을 안정적으로 다루는 방법에 집중합니다.
  detail: >
    Building on hands-on experience as a core contributor to the EXAONE and K-EXAONE
    series at LG AI Research, we study the full training pipeline of large language
    models — and long-context capability in particular. Our goal is models whose
    performance holds up even over contexts of hundreds of thousands of tokens.
  detail_ko: >
    LG AI Research에서 EXAONE · K-EXAONE 시리즈의 핵심 기여자로 참여하며 축적한 경험을 바탕으로,
    대규모 언어모델의 학습 파이프라인 전반과 특히 long-context 처리 능력을 연구합니다.
    수십만 토큰 규모의 문맥에서도 성능이 무너지지 않는 모델을 만드는 것이 목표입니다.

- title: "Retrieval-Augmented Generation"
  summary: >
    We develop methods that make language models actually use retrieved evidence,
    and build Korean benchmarks that measure this properly.
  summary_ko: >
    검색으로 얻은 근거를 언어모델이 제대로 활용하도록 만드는 방법과,
    이를 제대로 측정할 수 있는 한국어 벤치마크를 구축합니다.
  detail: >
    RAG is the most practical way past a language model's knowledge limits, but the
    longer and noisier the retrieved context, the more models miss or misread the
    evidence. We build benchmarks that pinpoint these failure modes (Ko-LongRAG)
    and develop training and inference techniques that fix them.
  detail_ko: >
    RAG는 언어모델의 지식 한계를 넘는 가장 실용적인 길이지만, 검색 결과가 길고 노이즈가 많을수록
    모델이 근거를 놓치거나 잘못 읽는 문제가 발생합니다. 우리는 이 실패 지점을 정밀하게 측정하는
    벤치마크(Ko-LongRAG)를 만들고, 이를 개선하는 학습·추론 기법을 연구합니다.

- title: "LLM Evaluation & Robustness"
  summary: >
    We expose the biases and vulnerabilities of LLM judges
    and design evaluation protocols you can trust.
  summary_ko: >
    LLM 심사자(LLM-as-a-judge)의 편향과 취약점을 밝히고,
    믿을 수 있는 평가 프로토콜을 설계합니다.
  detail: >
    Evaluating language models with language models has become the standard — but
    these judges are swayed by signals irrelevant to quality: expressions of
    uncertainty, persuasive style, code formatting, visual cues. We systematically
    reveal these biases and develop methods that make evaluation reflect true quality.
  detail_ko: >
    언어모델로 언어모델을 평가하는 방식이 표준이 되었지만, 그 심사자는 불확실성 표현, 설득적 문체,
    코드 스타일, 시각 정보 같은 본질과 무관한 신호에 흔들립니다. 우리는 이런 편향을 체계적으로 드러내고,
    평가가 실제 품질을 반영하도록 만드는 방법을 연구합니다.

- title: "Personalization & Memory"
  summary: >
    We study when persistent-memory language models should apply
    user preferences — and when they should suppress them.
  summary_ko: >
    지속 메모리를 가진 언어모델이 사용자 선호를 언제 적용하고
    언제 억제해야 하는지를 다룹니다.
  detail: >
    As language models begin storing user preferences in long-term memory, a new
    question emerges: when should a preference not be applied? In formal
    communication, personal taste must yield to social and institutional norms.
    We measure and improve this context-sensitive selectivity (BenchPreS).
  detail_ko: >
    언어모델이 사용자 선호를 장기 기억에 저장하기 시작하면서, "언제 그 선호를 쓰지 않아야 하는가"가
    새로운 문제로 떠올랐습니다. 공적인 커뮤니케이션에서는 개인 취향을 억제해야 하죠.
    우리는 이 맥락 민감한 선택성을 측정하고 개선하는 연구를 진행합니다(BenchPreS).

- title: "Dialogue & Interactive Systems"
  summary: >
    We automatically generate natural dialogue data
    and raise the quality of interactive AI systems.
  summary_ko: >
    자연스러운 대화 데이터를 자동으로 만들고,
    상호작용하는 AI 시스템의 품질을 끌어올립니다.
  detail: >
    Good dialogue systems come from good dialogue data. We study frameworks that
    automatically generate dialogues with natural topic shifts from knowledge graphs
    and documents, and connect this data to real service quality.
  detail_ko: >
    좋은 대화 시스템은 좋은 대화 데이터에서 나옵니다. 지식 그래프와 문서로부터 주제 전환이 자연스러운
    대화를 자동 생성하는 프레임워크를 연구하고, 이를 실제 서비스 품질로 연결하는 방법을 찾습니다.

- title: "Agent LLM"
  summary: >
    We study LLM agents that plan, use tools, and act over long horizons —
    and how to evaluate them reliably.
  summary_ko: >
    계획을 세우고 도구를 사용하며 장기적으로 행동하는 LLM 에이전트와,
    이를 신뢰할 수 있게 평가하는 방법을 연구합니다.
  detail: >
    Language models are becoming agents that plan, call tools, browse, and write
    code over long horizons. We study how to train and evaluate such agents — how
    they decompose tasks, recover from failure, and remain trustworthy while acting
    autonomously.
  detail_ko: >
    언어모델은 이제 계획을 세우고, 도구를 호출하고, 코드를 작성하며 스스로 행동하는 에이전트로
    진화하고 있습니다. 우리는 에이전트가 과제를 분해하고 실패에서 회복하며, 자율적으로 행동하면서도
    신뢰를 유지하도록 학습하고 평가하는 방법을 연구합니다.
